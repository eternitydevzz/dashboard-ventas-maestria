<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Dashboard de ventas">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1330"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <radialGradient id="luzAzul" cx="0.18" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#2f55d4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f55d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luzAcento" cx="0.92" cy="0.05" r="0.5">
      <stop offset="0" stop-color="#7b1a22" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7b1a22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barra" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4f7cf0"/>
      <stop offset="1" stop-color="#9db6ff"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#fondo)"/>
  <rect width="1280" height="420" rx="28" fill="url(#luzAzul)"/>
  <rect width="1280" height="420" rx="28" fill="url(#luzAcento)"/>

  <!-- Logo -->
  <g transform="translate(96 118)">
    <rect width="112" height="112" rx="26" fill="#2f55d4"/>
    <rect x="25" y="62" width="16" height="25" rx="5" fill="#fff"/>
    <rect x="48" y="45" width="16" height="42" rx="5" fill="#fff"/>
    <rect x="71" y="25" width="16" height="62" rx="5" fill="#fff"/>
  </g>

  <!-- Título -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="240" y="168" font-size="60" font-weight="700" letter-spacing="-1.5">Dashboard de ventas</text>
    <text x="242" y="214" font-size="25" fill="#aab6d8">CRM · Callers · Closers · KPIs · Comisiones · Finanzas</text>
  </g>

  <!-- Chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#dfe6ff">
    <g transform="translate(242 252)">
      <rect width="118" height="36" rx="18" fill="url(#vidrio)" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="59" y="24" text-anchor="middle">Next.js</text>
    </g>
    <g transform="translate(372 252)">
      <rect width="128" height="36" rx="18" fill="url(#vidrio)" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="64" y="24" text-anchor="middle">Supabase</text>
    </g>
    <g transform="translate(512 252)">
      <rect width="168" height="36" rx="18" fill="url(#vidrio)" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="84" y="24" text-anchor="middle">GoHighLevel</text>
    </g>
    <g transform="translate(692 252)">
      <rect width="190" height="36" rx="18" fill="#2f55d4" fill-opacity="0.35" stroke="#4f7cf0" stroke-opacity="0.7"/>
      <text x="95" y="24" text-anchor="middle">✨ Claude Code</text>
    </g>
  </g>

  <!-- Mini gráfico de ventas -->
  <g transform="translate(960 96)">
    <rect width="232" height="228" rx="22" fill="url(#vidrio)" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="22" y="40" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" letter-spacing="1.5" fill="#8f9cc4">FACTURACIÓN</text>
    <text x="22" y="76" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="32" font-weight="700" fill="#f5b942">$9,083</text>
    <rect x="26" y="168" width="26" height="36" rx="6" fill="url(#barra)"/>
    <rect x="64" y="146" width="26" height="58" rx="6" fill="url(#barra)"/>
    <rect x="102" y="128" width="26" height="76" rx="6" fill="url(#barra)"/>
    <rect x="140" y="112" width="26" height="92" rx="6" fill="url(#barra)"/>
    <rect x="178" y="94" width="26" height="110" rx="6" fill="url(#barra)"/>
  </g>
</svg>
